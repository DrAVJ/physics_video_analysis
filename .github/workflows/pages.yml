# Publicerar den här mappens innehåll på GitHub Pages.
#
# Ingen byggsteg här — filen som checkas in ÄR sidan. Källkoden, testerna och
# dokumentationen ligger i det privata repot DrAVJ/videoanalys-src; det här
# repot får bara den färdigbyggda, minifierade filen.
#
# Slår på Pages automatiskt vid första körningen (configure-pages med
# enablement: true) — inget att klicka i Settings.
name: Publicera sidan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Städa ihop sajten
        # Bara index.html publiceras — .git och den här workflown ska inte
        # följa med i det som uploadas som sidans innehåll.
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
